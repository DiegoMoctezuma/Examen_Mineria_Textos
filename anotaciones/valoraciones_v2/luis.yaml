Q14:
  texto: La respuesta es poco creíble, pues no identifica claramente las dependencias y empresas participantes
    ni la cantidad de jóvenes beneficiados. Además, mezcla montos de becas individuales con inversiones
    generales y presenta inconsistencias en la periodicidad de los pagos.
