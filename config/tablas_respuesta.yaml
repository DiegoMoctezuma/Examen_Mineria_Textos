# Mapa consulta → campos de respuesta (PRD §6.13.2, D17). Fijado ANTES de generar las tablas.
#
# Cada campo:
#   fuente: entidad (salida/entidades_enriquecidas.csv) | auxiliar (salida/cantidades_auxiliares.csv)
#   tipo: PER | ORG | LOC | FECHA | MONTO (entidad) · CANTIDAD | PORCENTAJE (auxiliar)
#   unidades: solo auxiliares; unidades aceptadas (columna `unidad`)
#   filtro: d14 | entidades_federativas | organizacion_empresarial (intersección con el gazetteer)
#   patrones_contexto: lista de regex en minúsculas sin acentos; TODAS deben aparecer en el
#     contexto (±60 caracteres alrededor del span y oración contigua) para `respaldado_en_texto`.
#     Sin ellas el valor queda `ambiguo` con su cita.
#   relacion: evidencia mínima que exige el PRD.
#   unidad: la que se escribe en `respuestas.csv` cuando el valor no la trae.
#   unico_por_evento: si es true, dos valores distintos con evidencia en la misma intervención
#     se marcan `contradictorio` (nunca se resuelve por mayoría).

Q1:
  - campo: dependencias y empresas
    fuente: entidad
    tipo: ORG
    patrones_contexto: ["tren maya|tramo|maya", "constru|particip|contrat|obra|trabaj|encarg|opera|invers|licit|ejecut"]
    relacion: participación o inversión vinculada al Tren Maya
  - campo: estados
    fuente: entidad
    tipo: LOC
    filtro: entidades_federativas
    patrones_contexto: ["tren maya|tramo|maya|via|estacion"]
    relacion: estado por donde pasa o donde se construye el Tren Maya
  - campo: montos
    fuente: entidad
    tipo: MONTO
    patrones_contexto: ["tren maya|tramo|maya", "invers|cost|presupuest|destin|gast|contrat|obra|constru"]
    relacion: inversión o costo vinculado al Tren Maya

Q2:
  - campo: farmacéuticas
    fuente: entidad
    tipo: ORG
    filtro: d14
    patrones_contexto: ["vacun|dosis|biologic|lote|envas"]
    relacion: farmacéutica o vacuna en la entrega, aplicación o gestión de vacunas
  - campo: funcionarios
    fuente: entidad
    tipo: PER
    patrones_contexto: ["vacun|dosis|aplic|biologic|salud|subsecretari|secretari|director"]
    relacion: funcionario que gestiona, informa o aplica vacunas
  - campo: fechas
    fuente: entidad
    tipo: FECHA
    patrones_contexto: ["vacun|dosis|lleg|arrib|recib|aplic|entreg|embarque"]
    relacion: fecha de llegada, entrega o aplicación de vacunas
  - campo: dosis
    fuente: auxiliar
    tipo: CANTIDAD
    unidades: [dosis, vacunas]
    unidad: dosis
    patrones_contexto: ["vacun|dosis|lleg|recib|aplic|entreg|envas"]
    relacion: cantidad de dosis vinculada al evento citado

Q3:
  - campo: organizaciones
    fuente: entidad
    tipo: ORG
    patrones_contexto: ["dos bocas|refineria|olmeca", "constru|particip|contrat|obra|encarg|opera|invers|respons|ejecut"]
    relacion: responsabilidad o participación explícita en Dos Bocas o la refinería Olmeca
  - campo: responsables
    fuente: entidad
    tipo: PER
    patrones_contexto: ["dos bocas|refineria|olmeca", "director|secretari|encarg|respons|coordin|construc|a cargo"]
    relacion: persona responsable de Dos Bocas o la refinería Olmeca
  - campo: montos de inversión
    fuente: entidad
    tipo: MONTO
    patrones_contexto: ["dos bocas|refineria|olmeca", "invers|cost|presupuest|destin|gast|cuest|vale"]
    relacion: inversión o costo explícito de Dos Bocas o la refinería Olmeca

