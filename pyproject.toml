[project]
name = "mtx"
version = "0.1.0"
description = "Sistema de recuperación y extracción de información sobre discursos presidenciales (Examen 1, Minería de Textos)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "nltk",
    "regex",
    "datasets",
    "pyarrow",
    "transformers",
    "torch",
    "streamlit",
    "python-pptx",
    "pyyaml",
    "rich",
    "plotly",
    "kaleido",
    "pypdf",
    "spacy>=3.8,<3.9",
    "es-core-news-md",
]

[dependency-groups]
dev = [
    "pytest",
    "rank_bm25",
    "ruff",
]
# Candidatos NER de v2 (WP-10, D34): tokenizador SentencePiece de XLM-R y spaCy lg. Solo los usa
# `make comparacion-ner`; `uv run --group ner-v2 ...` los instala sin tocar el resto del entorno.
ner-v2 = [
    "sentencepiece",
    "es-core-news-lg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtx"]

# torch en CPU: Linux y Windows desde el índice de PyTorch; macOS usa el wheel por defecto.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
es-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_lg-3.8.0/es_core_news_lg-3.8.0-py3-none-any.whl" }
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not lento'"
markers = [
    "lento: usa el corpus o modelos reales (requiere red); se corre con `make test-lento`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["kit"]
